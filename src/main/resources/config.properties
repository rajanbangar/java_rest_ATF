# Base Configuration for API Testing
# Base URL for reqres.in
base.url=https://reqres.in
api.base.path=/api

# Timeout settings (in milliseconds)
connection.timeout=10000
socket.timeout=10000

# Retry settings
retry.count=3
retry.interval=2000

# Logging
log.level=INFO
log.request=true
log.response=true

# Reporting
allure.enabled=true
extent.enabled=true

# Environment
environment=qa
